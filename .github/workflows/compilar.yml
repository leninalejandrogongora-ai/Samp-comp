name: Compilar Gamemode SA-MP

on:
  push:
    paths:
      - 'gamemodes/**.pwn'
      - 'filterscripts/**.pwn'
      - '.github/workflows/compilar.yml'

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar pawncc y descargar includes SA-MP
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          sudo apt-get install -y gcc-multilib g++-multilib cmake git
          git clone https://github.com/pawn-lang/compiler.git /tmp/pawncc
          cd /tmp/pawncc
          mkdir build && cd build
          cmake ../source/compiler -DCMAKE_C_FLAGS=-m32 -DCMAKE_BUILD_TYPE=Release -DPAWNC_BUILD_SHARED=OFF
          make -j$(nproc)
          sudo cp pawncc /usr/local/bin/pawncc
          sudo chmod +x /usr/local/bin/pawncc
          git clone --depth=1 https://github.com/pawn-lang/samp-stdlib.git /tmp/samp-stdlib
          sudo mkdir -p /usr/local/share/pawn/include
          sudo cp /tmp/samp-stdlib/*.inc /usr/local/share/pawn/include/
          sudo cp $GITHUB_WORKSPACE/include/*.inc /usr/local/share/pawn/include/ 2>/dev/null || true
          echo "Includes en /usr/local/share/pawn/include:"
          ls /usr/local/share/pawn/include/

      - name: Compilar gamemodes
        run: |
          mkdir -p output/gamemodes
          for pwn in gamemodes/*.pwn; do
            [ -f "$pwn" ] || continue
            echo "Compilando $pwn..."
            pawncc "$pwn" -i/usr/local/share/pawn/include -i$GITHUB_WORKSPACE/include -i$GITHUB_WORKSPACE/gamemodes -o"output/${pwn%.pwn}.amx"
            if [ $? -eq 0 ]; then
              echo "OK: $pwn compilado"
            else
              echo "FALLO: $pwn"
              exit 1
            fi
          done

      - name: Compilar filterscripts
        run: |
          mkdir -p output/filterscripts
          for pwn in filterscripts/*.pwn; do
            [ -f "$pwn" ] || continue
            echo "Compilando $pwn..."
            pawncc "$pwn" -i/usr/local/share/pawn/include -i$GITHUB_WORKSPACE/include -i$GITHUB_WORKSPACE/filterscripts -o"output/${pwn%.pwn}.amx"
            if [ $? -eq 0 ]; then
              echo "OK: $pwn compilado"
            else
              echo "FALLO: $pwn"
              exit 1
            fi
          done

      - name: Subir archivos compilados
        uses: actions/upload-artifact@v4
        with:
          name: archivos-compilados
          path: output/
          retention-days: 7
